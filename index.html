<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngineerBabu CSE - Document Management</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Theme Toggle -->
    <div class="theme-toggle-container">
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
            <span class="toggle-icon">🌙</span>
        </button>
    </div>

    <!-- Header Section -->
    <header class="header">
        <div class="header-content">
            <div class="logo-section">
                <div class="brand-logo">
                    <img src="tt.png" alt="EngineerBabu CSE" class="brand-image">
                </div>
                <p class="subtitle">EngineerBabu CSE Style !!</p>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Content will be rendered by JavaScript -->
    </main>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button id="closeModal" class="modal-close" aria-label="Close modal">&times;</button>
            <div id="viewer" class="viewer"></div>
            <a id="downloadBtn" href="#" download class="download-btn">Download File</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
